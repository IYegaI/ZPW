<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <script>
        $(function(){
            // $("#sprawdz").click(function(){
            //     if($("#nazwisko").val().trim() === ""){
            //         $("#komunikat").text("Podaj nazwisko").css("color", "red")
            //     } else {
            //         $("#komunikat").text("Wysłano formularz").css("color", "green")
            //     }
            // })
            $("#sprawdz2").click(function(){
                let wiek = $("#wiek").val()
                if(isNaN(wiek)){
                    $("#blad").text("Wiek musi byc liczba")
                } else{
                    $("#blad").text("Masz " + wiek + " lat.")
                }
            })

            $("#sprawdzOcene").click(function(){
                let ocena = $("#ocena").val().trim()
                if(ocena === ""){
                    $("#error").text("Pole nie może być puste")
                } else if(ocena < 1 || ocena > 6){
                    $("#error").text("Ocena musi być z zakresu 1-6")
                } else {
                    $("#error").text("Zapisano ocenę " + ocena)
                }
            })
        })
    </script>
    <style>
        
    </style>
</head>
    <body>
      <input type="text" name="Nazwisko" id="nazwisko">
      <input type="button" id="sprawdz" value="Wyślij">
      <p id="komunikat"></p>
      <hr>
      <input type="text" name="" id="wiek">
      <button id="sprawdz2">Sprawdź</button>
      <p id="blad"></p>
      <hr>
      <input type="text" name="" id="ocena">
      <button id="sprawdzOcene">Sprawdź</button>
      <p id="error"></p>
    </body>
</html>
