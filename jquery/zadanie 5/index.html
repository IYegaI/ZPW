<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>

  </style>
    <script>
         $(function(){
           $("#naKoniec").click(function(){
            let wpisanyProdukt = $("#produkt").val();
                if(wpisanyProdukt != 0){
                $("ul").append("<li>" + wpisanyProdukt + "</li>")
                $("li").last().css({
                    "color": "green",
                    "font-weight": "bold"
                });
            }
            $("#produkt").val("");
            });

            $("#naPoczatek").click(function(){
                let wpisanyProdukt = $("#produkt").val();
                if(wpisanyProdukt != 0){
                $("ul").prepend("<li>" + wpisanyProdukt + "</li>").css();
                $("li").first().css({
                    "color": "red",
                    "font-weight": "bold"
                });
            }
            $("#produkt").val("");
            });
            

            $("#answer").change(function(){
                if(this.checked){
                    $("#send").removeAttr("disabled");
                }else{
                   $("#send").attr("disabled", "disabled"); 
                }
            })

            

    });

        
    </script>


</head>
<body>

    <ul id="lista">
      <li>Chleb</li>
      <li>Mleko</li>
    </ul>

    <input type="text" id="produkt" placeholder="Nazwa produktu">

    <button id="naKoniec">Dodaj na koniec</button>

    <button id="naPoczatek">Dodaj na początek</button>
    <br>
    <input type="checkbox" id="answer" name="answer">
    <label for="answer">zgadzam sie na wysłanie</label>
    <button id="send" disabled >Wyślij</button>









</body>
</html>
