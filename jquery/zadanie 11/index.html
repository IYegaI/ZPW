<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <script>
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault()
                if($("#nick").val() === ""){
                    $("#info").text("Podaj nick!")
                } else {
                    $("#info").text("Wysłano")
                }
            })
            $("#profil").submit(function(e){
                e.preventDefault()
                if($("#haslo").val().length < 6){
                    $("#error").css("color", "red").text("Hasło jest za krótkie")
                } else {
                    $("#error").css("color", "green").text("Zalogowano")
                }
            })
            $("#kolor").change(function(){
                $("body").css("background-color", $(this).val())
            })
            $("#wybor").change(function(){
                $("#podsumowanie").text("Do zapłaty: " + $(this).val() + "zł");
            })
        })
    </script>
    <style>
        
    </style>
</head>
    <body>
        <form id="formularz">
            <input type="text" id="nick">
            <button>Wyślij</button>
        </form>
        <p id="info"></p>
        <hr>
        <form id="profil">
            <input type="text" id="email">
            <input type="text" id="haslo">
            <button>Wyślij</button>
        </form>
        <p id="error"></p>
        <hr>
        <select id="kolor">
            <option value="white">Biały</option>
            <option value="yellow">Żółty</option>
            <option value="lightblue">Niebieski</option>
        </select>
        <hr>
        <select id="wybor">
            <option value="20">Mała(20)</option>
            <option value="30">Średnia(30)</option>
            <option value="40">Duża(40)</option>
        </select>
        <p id="podsumowanie"></p>
        <hr>
    </body>
</html>
