<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <script>
        $(function(){
            $("#tekst").keyup(function(e){
                let numberOfCharacters = $("#tekst").val().length
                if(numberOfCharacters <= 10){
                    $("#pozostalo").text("Pozostało znaków: " + (10 -($("#tekst").val().length)))
                    $("#pozostalo").removeClass("blad")
                } else {
                    $("#pozostalo").text("pozostało znaków: "+ 0)
                    $("#pozostalo").addClass('blad')
                }

                if(e.key=="Escape"){
                    $("#pozostalo").text("Pozostało znaków: 10");
                    $("#pozostalo").removeClass("blad")
                    $(this).val("")
                }

                if(e.key == "Enter" && $(this).val == "admin"){
                    console.log("Dostęp przyznany")
                }
            })
        })
    </script>
    <style>
        .podswietlony{
            background-color: yellow;
        }
        .blad {
            background-color: red;
        }
    </style>
</head>
    <body>
         <input type="text" name="" id="tekst">
         <p id="pozostalo">Pozostało znaków: </p>

    </body>
</html>
